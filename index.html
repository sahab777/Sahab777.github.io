<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sahab777 | Redeem</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#351000 0%,#120700 35%,#050505 75%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:92%;
  max-width:420px;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;
  color:#ff5a00;
  text-shadow:0 0 25px #ff4500;
}

.tag{
  color:#aaa;
  margin-top:5px;
  margin-bottom:35px;
  font-size:13px;
  letter-spacing:2px;
}

.card{
  background:rgba(20,20,20,.94);
  border:1px solid #492000;
  border-radius:18px;
  padding:28px 22px;
  box-shadow:0 0 35px rgba(255,70,0,.18);
}

h2{
  font-size:24px;
  margin-bottom:8px;
}

.subtitle{
  color:#888;
  font-size:13px;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:16px;
  border-radius:10px;
  border:1px solid #444;
  outline:none;
  background:#090909;
  color:white;
  text-align:center;
  font-size:15px;
  letter-spacing:2px;
}

input:focus{
  border-color:#ff5500;
  box-shadow:0 0 15px rgba(255,80,0,.25);
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff3c00,#ff7300);
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,70,0,.3);
}

button:active{
  transform:scale(.97);
}

#message{
  margin-top:18px;
  font-size:13px;
  color:#ff9a66;
  min-height:20px;
}

.links{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.links a{
  color:#777;
  text-decoration:none;
  font-size:12px;
}

.links a:hover{
  color:#ff6500;
}

.footer{
  margin-top:22px;
  color:#555;
  font-size:10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">SAHAB777</div>
  <div class="tag">PERSONAL GAMING HUB</div>

  <div class="card">

    <h2>REDEEM CODE</h2>

    <div class="subtitle">
      Enter your code below
    </div>

    <input
      id="code"
      type="text"
      placeholder="ENTER CODE"
      maxlength="16"
    >

    <button onclick="redeem()">
      REDEEM NOW
    </button>

    <div id="message"></div>

  </div>

  <div class="links">
    <a href="#">HOME</a>
    <a href="#">PROFILE</a>
    <a href="#">CONTACT</a>
  </div>

  <div class="footer">
    FAN-MADE PERSONAL WEBSITE • NOT AFFILIATED WITH GARENA
  </div>

</div>

<script>
function redeem(){

  let code = document.getElementById("code").value.trim();
  let message = document.getElementById("message");

  if(code === ""){
    message.innerHTML = "⚠️ Please enter a code.";
    return;
  }

  message.innerHTML =
    "✓ Demo code received — this personal site does not actually redeem codes.";
}
</script>

</body>
</html>
